l_english:
 trait_blood_of_albion:0 "Blood of Albion"
 trait_blood_of_albion_desc:0 "Albion remembers the wars over Armorica and the Levant, but also the bargains, ports, and promises that secured allies and Israel's freedom."
 trait_blood_of_armenia:0 "Blood of Armenia"
 trait_blood_of_armenia_desc:0 "Though Caucasus fell and Armenia suffered grievous losses, its people rebuilt a realm and endured."
 trait_blood_of_belgia:0 "Blood of Belgia"
 trait_blood_of_belgia_desc:0 "Born from Remia's great unification, Belgia moved its capital to Celtica and rallied allies after a rebel tore through its lands."
 trait_blood_of_dacia:0 "Blood of Dacia"
 trait_blood_of_dacia_desc:0 "From Getia, Dacia grew into a great power, built the Tomb of Sveshtari, and fought for Bactria and its frontiers."
 trait_blood_of_germania:0 "Blood of Germania"
 trait_blood_of_germania_desc:0 "Formed by Scandia, Germania carries the memory of the secret pact that seized Ethiopia and the surrounding ports."
 trait_blood_of_greater_iberia:0 "Blood of Greater Iberia"
 trait_blood_of_greater_iberia_desc:0 "Born of Turdetania, Greater Iberia grew swiftly, fought Carthage at great cost, and subdued vast indian territories."
 trait_blood_of_israel:0 "Blood of Israel"
 trait_blood_of_israel_desc:0 "Israel secured its independence from Albion with a promise of eternal friendship."
 trait_blood_of_macedon:0 "Blood of Macedon"
 trait_blood_of_macedon_desc:0 "Macedon reclaimed lands lost to the Antigonids, expanded into Greece, and agreed a frontier with Dacia."
 trait_blood_of_numidia:0 "Blood of Numidia"
 trait_blood_of_numidia_desc:0 "Born from Mauretania's western unification, Numidia embraced Canaanite faith and carried its reach east."
 trait_blood_of_scythia:0 "Blood of Scythia"
 trait_blood_of_scythia_desc:0 "A civil war replaced Scythia's ruling house, and later rebellion forced painful concessions; still its legacy endured."
 trait_blood_of_tuscia:0 "Blood of Tuscia"
 trait_blood_of_tuscia_desc:0 "Tuscia grew wealthy and wide, remade the western balance through war and liberation, and reached from Italy to the Gallic frontier and beyond."
 trait_blood_of_the_winner:0 "Blood of the Winner"
 trait_blood_of_the_winner_desc:0 "A legacy of triumph, carried by the dynasty that rose above its rivals."
