 eleusinian_mysteries_desc: "The Eleusinian Mysteries were initiation ceremonies held every year for the cult of Demeter and Persephone based at Eleusis in ancient Greece. They are the 'most famous of the secret religious rites of ancient Greece'. The mysteries represented the myth of the abduction of Persephone from her mother Demeter by Hades, the god of the underworld. The rites symbolized the cycle of life and death, as well as the promise of rebirth and eternal life."
